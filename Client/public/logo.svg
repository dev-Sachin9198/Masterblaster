<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background & Text Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Background -->
  <circle cx="250" cy="250" r="230" fill="url(#bgGradient)" stroke="url(#primaryGradient)" stroke-width="8" />

  <!-- Dynamic Energy / Blast Icon (Abstract 'M' or Blaster Shape) -->
  <g filter="url(#glow)">
    <!-- Left Wing / Bolt -->
    <path d="M160 140 L230 250 L180 360 L130 360 L170 260 L120 140 Z" fill="url(#primaryGradient)" />
    <!-- Right Wing / Bolt -->
    <path d="M340 140 L270 250 L320 360 L370 360 L330 260 L380 140 Z" fill="url(#primaryGradient)" />
    <!-- Center Core Star / Blast -->
    <polygon points="250,170 270,230 330,250 270,270 250,330 230,270 170,250 230,230" fill="#fbbf24" />
  </g>

  <!-- Brand Typography: MASTERBLASTER -->
  <text x="250" y="420" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="url(#textGradient)" text-anchor="middle" letter-spacing="4">
    MASTERBLASTER
  </text>
</svg>
